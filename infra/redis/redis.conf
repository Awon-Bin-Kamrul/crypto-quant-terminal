# ------------------------------------------------------------------------------------------
# Crypto Quant Terminal — Redis configuration.
#
# Redis carries two very different kinds of traffic (docs/ARCHITECTURE.md, D5 and §10):
#   Streams  — events that drive trading decisions. Must never be silently lost.
#   Pub/Sub  — latest-wins display data (order book). Losing a frame is harmless.
# The settings below follow from that split. The password is passed on the command line
# by docker-compose (--requirepass) so it never lives in this file.
#
# Linux hosts: set vm.overcommit_memory=1 (sysctl) so AOF rewrites can fork under memory
# pressure. It is a host kernel setting and cannot be applied from docker-compose.
# ------------------------------------------------------------------------------------------

# --- Network -------------------------------------------------------------------------------
# Bound to all interfaces inside the container; docker-compose publishes the port on
# 127.0.0.1 only, and a password is always required.
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
tcp-keepalive 60
timeout 0

# --- Durability ----------------------------------------------------------------------------
# AOF with fsync every second: at most ~1 s of stream writes can be lost on a hard crash,
# and every stream is also persisted to TimescaleDB before it is trimmed.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
# RDB snapshots off: AOF is the single source of durability; avoids a second fork.
save ""
dir /data

# --- Memory --------------------------------------------------------------------------------
# Only keys with a TTL (the cache:* namespace) are ever evicted. Streams have no TTL, so
# when memory is exhausted by streams, writes fail loudly instead of dropping data.
maxmemory 1gb
maxmemory-policy volatile-lru
maxmemory-samples 10

# --- Pub/Sub back-pressure -----------------------------------------------------------------
# A subscriber that falls more than 32 MB behind (or 8 MB for 60 s) is disconnected rather
# than letting its buffer grow without bound. The WS gateway reconnects and resyncs.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# --- Streams -------------------------------------------------------------------------------
stream-node-max-bytes 4096
stream-node-max-entries 100

# --- Observability -------------------------------------------------------------------------
loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 25

# --- Safety --------------------------------------------------------------------------------
# Commands that can wipe or stall a shared instance are disabled for every client.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command KEYS ""
